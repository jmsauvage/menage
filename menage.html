<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sauvage</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 30px;
    }
    select, button {
      margin: 10px;
      padding: 10px;
      font-size: 16px;
    }
    #datetime {
      font-size: 1.2em;
      margin-top: 10px;
    }
    label {
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h2>Bonjour, bienvenue chez les Sauvage !</h2>

  <div>
    <label for="salarie">Je suis :</label>
    <select id="salarie">
      <option value="Margot">Margot</option>
      <option value="Ana-Maria">Ana-Maria</option>
    </select>
  </div>

  <div id="datetime">Chargement…</div>

  <div>
    <button onclick="envoyerAction('debut')">Début d'intervention</button>
    <button onclick="envoyerAction('fin')">Fini pour aujourd'hui</button>
  </div>

  <script>
    function updateDateTime() {
      const maintenant = new Date();
      const date = maintenant.toLocaleDateString('fr-FR');
      const heure = maintenant.toLocaleTimeString('fr-FR');
      document.getElementById('datetime').textContent =
        'Nous sommes le ' + date + ' — Il est ' + heure;
    }

    // Mise à jour immédiate
    updateDateTime();
    // Mise à jour toutes les secondes
    setInterval(updateDateTime, 1000);

    function envoyerAction(action) {
      const nom = document.getElementById('salarie').value;
      const url = 'https://hook.eu2.make.com/4hz04ajjxwy3drpvcbc8tdfub3icmvcr?salarie=' +
                  encodeURIComponent(nom) +
                  '&action=' + action;
      fetch(url)
        .then(() => alert('Heure enregistrée pour ' + nom + ' (' + action + ')'))
        .catch(() => alert("Erreur lors de l'envoi."));
    }

  </script>

</body>
</html>
